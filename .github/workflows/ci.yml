name: CI/CD Pipeline - Peblo TV Mini

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 1. Backend Lint & Unit/Integration Tests
  backend-test:
    name: Backend Test & Lint Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: pablo_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/pablo_test_db
          SECRET_KEY: ci_cd_test_secret_key_peblo_2026
        run: |
          pytest -v

  # 2. Frontend CMS & Viewer Typechecks & Production Build
  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            adminAndEditor/package-lock.json
            Viewer/package-lock.json

      - name: Build CMS (adminAndEditor)
        working-directory: ./adminAndEditor
        run: |
          npm ci
          npm run build

      - name: Build Viewer (Kids Streaming UI)
        working-directory: ./Viewer
        run: |
          npm ci
          npm run build

  # 3. Docker Image Build Verification
  docker-build:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: peblo-backend:latest

      - name: Build CMS Image
        uses: docker/build-push-action@v5
        with:
          context: ./adminAndEditor
          push: false
          tags: peblo-cms:latest

      - name: Build Viewer Image
        uses: docker/build-push-action@v5
        with:
          context: ./Viewer
          push: false
          tags: peblo-viewer:latest

  # 4. Deployment Pipeline (Documented Staging/Production Flow)
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy Announcement & Orchestration
        run: |
          echo "==============================================================="
          echo "🚀 Peblo TV Mini Deployment Pipeline"
          echo "1. Push built container images to Container Registry (e.g. AWS ECR / GCP GCR / Docker Hub)."
          echo "2. Run zero-downtime Alembic migrations (e.g. via Kubernetes init-containers or ECS migration task)."
          echo "3. Blue/Green rolling deploy to compute clusters (e.g. AWS ECS / EKS / Render / Fly.io)."
          echo "4. Invalidate CDN cache for edge-distributed static assets."
          echo "5. Run post-deploy health check at https://api.peblo.tv/health."
          echo "==============================================================="
